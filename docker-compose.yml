services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      FRONTEND_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql+psycopg://autoflowops:autoflowops@db:5432/autoflowops"
      REDIS_URL: "redis://redis:6379/0"
      JOB_EXECUTION_MODE: "celery"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      DATABASE_URL: "postgresql+psycopg://autoflowops:autoflowops@db:5432/autoflowops"
      REDIS_URL: "redis://redis:6379/0"
      JOB_EXECUTION_MODE: "celery"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoflowops
      POSTGRES_USER: autoflowops
      POSTGRES_PASSWORD: autoflowops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoflowops -d autoflowops"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
